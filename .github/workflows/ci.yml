name: CI

# Continuous Integration pipeline for the Software Architecture Labs project.
# Builds the Group/Ungroup Maven module with Maven and runs its JUnit tests on
# every push to main and on every pull request.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # `package` runs the full lifecycle up to and including the test phase
      # (compile -> test -> package), so this single step both builds the
      # project and executes the JUnit tests via the Surefire plugin.
      - name: Build and test L3 ci-demo (JUnit 5)
        run: mvn -B package --file L3/ci-demo/pom.xml

      # L7 Testing Lab: JUnit 4 + Mockito tests for the Group/Ungroup logic.
      - name: Build and test L7 group-tests (JUnit 4 + Mockito)
        run: mvn -B package --file L7/group-tests/pom.xml

      # L9 BDD Lab: JGiven + AssertJ Given-When-Then scenarios.
      - name: Build and test L9 bdd-tests (JGiven + AssertJ)
        run: mvn -B package --file L9/bdd-tests/pom.xml
